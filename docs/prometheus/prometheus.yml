global:
  scrape_interval: 15s          # 生产环境用 15s（开发可改 5s）
  evaluation_interval: 15s
  external_labels:
    cluster: production
    service: idbackend

scrape_configs:
  # ──────────────────────────────────────────
  # idbackend 主应用（FastAPI）
  # ──────────────────────────────────────────
  # 假设 idbackend 与 idprom 同在 idnetwork（docker-compose user-defined 网络），
  # 因此可以用容器服务名直接访问，无需 host.docker.internal 之类的网关映射。
  - job_name: idbackend
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["idbackend:8000"]
        labels:
          instance: idbackend-1
          env: production

  # ──────────────────────────────────────────
  # Prometheus 自监控（看 Prometheus 自己的健康度）
  # ──────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["idprom:9090"]
        labels:
          instance: idprom-self

  # ──────────────────────────────────────────
  # 节点机器指标（可选：装 node-exporter 后启用）
  # ──────────────────────────────────────────
  # - job_name: node
  #   static_configs:
  #     - targets: ["idnode:9100"]
