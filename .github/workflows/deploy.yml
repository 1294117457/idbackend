name: Deploy

on:
  push:
    branches: [dev, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/idbackend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract branch tag
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/heads/}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "IMAGE=${REGISTRY}/${OWNER}/${IMAGE_NAME##*/}" >> $GITHUB_OUTPUT
          echo "IS_DEV=$([ "$TAG" = "dev" ] && echo "true" || echo "false")" >> $GITHUB_OUTPUT

      - name: Set deploy env
        run: |
          if ${{ steps.meta.outputs.IS_DEV }}; then
            echo "SERVER_HOST=${{ secrets.DEV_SERVER_HOST }}" >> $GITHUB_ENV
            echo "SERVER_USER=${{ secrets.DEV_SERVER_USER }}" >> $GITHUB_ENV
            echo "SERVER_KEY=${{ secrets.DEV_SSH_KEY }}" >> $GITHUB_ENV
          else
            echo "SERVER_HOST=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_ENV
            echo "SERVER_USER=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_ENV
            echo "SERVER_KEY=${{ secrets.PROD_SSH_KEY }}" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.IMAGE }}:${{ steps.meta.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_KEY }}
          script: |
            set -e
            cd /home/project
            docker compose pull
            docker compose up -d --remove-orphans
