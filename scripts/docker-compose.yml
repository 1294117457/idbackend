services:
  idpostgres:
    image: eyeix/postgres-zh:v17  # 预装 pgvector + zhparser
    container_name: idpostgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: zhouch
      POSTGRES_PASSWORD: zhouchenhui
      POSTGRES_DB: iddata
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhouch -d iddata"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idnetwork

  idredis:
    image: redis:7-alpine
    container_name: idredis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    command: redis-server --requirepass zhouchenhui --appendonly yes
    networks:
      - idnetwork

  idminio:
    image: minio/minio:latest
    container_name: idminio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
    environment:
      MINIO_ROOT_USER: zhouch
      MINIO_ROOT_PASSWORD: zhouchenhui
    command: server /data --console-address ":9001"
    networks:
      - idnetwork

networks:
  idnetwork:
    name: idnetwork
    driver: bridge