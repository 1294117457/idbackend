services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: zhouch
      POSTGRES_PASSWORD: zhouchenhui
      POSTGRES_DB: iddata
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhouch -d iddata"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    command: redis-server --requirepass zhouchenhui --appendonly yes
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
    environment:
      MINIO_ROOT_USER: zhouch
      MINIO_ROOT_PASSWORD: zhouchenhui
    command: server /data --console-address ":9001"
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    driver: bridge
